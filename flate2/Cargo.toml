[package]
name = "flate2"
version = "1.1.11"
edition.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/codeandsolder/zlib-rs-fast"
description = "Flate2 streaming API backed exclusively by zlib-rs"

[dependencies]
zlib-rs = { path = "../zlib-rs", version = "0.6.8", default-features = false, features = ["std"] }

[features]
default = ["zlib-rs"]
zlib-rs = []
# Feature names requested by external Cargo consumers. The native codec is always used.
rust_backend = []
miniz_oxide = []
runtime_detection = []
zlib = []
zlib-default = []
zlib-ng = []
zlib-ng-compat = []
cloudflare_zlib = []
miniz-sys = []
any_impl = []
any_zlib = []
any_c_zlib = []

[dev-dependencies]
rand = { version = "0.10", default-features = false }

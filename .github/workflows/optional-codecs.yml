name: Optional codec features

on:
  pull_request:
    paths: &codec_paths
      - '.github/workflows/optional-codecs.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain*'
      - 'zlib-rs/Cargo.toml'
      - 'zlib-rs/src/**'
      - 'zlib-rs/benches/**'
      - 'zlib-rs/examples/**'
  push:
    branches: [main]
    paths: *codec_paths
  schedule:
    - cron: '30 4 * * *'
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  optional-codecs:
    name: GPU, parallel and near-optimal
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@ce8f8a2849c8cc0ce221e4cb283a4bef0de4a01a # main
    with:
      validation-tier: routine
      rustflags: ""
      command: |
        cargo test --locked --workspace --lib --features gz,gpu,parallel,near-optimal

name: Strict Rust

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict-rust:
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@bc1cca5a1fdae152b14fe4399341ba41b601837f # main
    with:
      rust-toolchain: nightly-2026-11-19

  strict-rust-optional:
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@bc1cca5a1fdae152b14fe4399341ba41b601837f # main
    with:
      rust-toolchain: nightly-2026-11-19
      cargo-args: --locked --workspace --all-targets --features gz,gpu,parallel,near-optimal,__internal-api

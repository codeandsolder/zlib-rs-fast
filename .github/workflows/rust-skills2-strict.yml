name: Strict Rust

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict-rust:
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@1c04118f00c0d43a4a22e67645b2ff40f30975bb # main
    with:
      rust-toolchain: nightly-2026-11-20

  strict-rust-optional:
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@1c04118f00c0d43a4a22e67645b2ff40f30975bb # main
    with:
      rust-toolchain: nightly-2026-11-20
      cargo-args: --locked --workspace --all-targets --features gz,gpu,parallel,near-optimal,__internal-api
